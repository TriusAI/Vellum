# Vellum dev configuration.
# Paths are relative to this file's directory.

library_dir: ~/VellumLibrary
db: library.db

# informational: which GGUF each llama-server hosts.
models:
  llm: qwen3-4b.gguf
  embed: nomic-embed-text-v1.5.gguf

llm:
  think: false             # qwen3 thinking mode: better, much slower on CPU
  temperature: 0.3
  # The chat server's -c value — must match how it's started (pack launcher
  # and docker entrypoint use the same number). Bigger = safer for long docs.
  num_ctx: 8192

ocr:
  langs: eng+chi_sim+fin   # Tesseract language codes; data lives in ./tessdata
  dpi: 300
  min_chars_per_page: 50   # fewer extractable chars than this + images -> OCR the page
  workers: 3

summarize:
  chunk_chars: 6000
  max_tags: 8

tools:
  # mutool/tesseract resolve from PATH by default; the portable pack
  # overrides these to point at its bundled copies.
  # mutool: /path/to/mutool
  # tesseract: /path/to/tesseract
  # tessdata: /path/to/tessdata
  # llama.cpp serves one model per process: two small servers, chat + embed.
  llm_url: http://127.0.0.1:8081
  embed_url: http://127.0.0.1:8082
embed:
  batch: 32
  # nomic-embed-text-v1.5 has a 2048-token context; chunk inputs are
  # trimmed to this cap before embedding
  max_tokens: 1500
