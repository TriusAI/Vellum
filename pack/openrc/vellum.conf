# /etc/conf.d/vellum -- settings for the Vellum OpenRC service.
#
# Every variable below has a working default baked into /etc/init.d/vellum,
# so set only what you need to change. Uncomment to override.

# Where the portable pack lives: the `vellum` binary, config.yaml, models/,
# llm/, bin/ (mutool + tesseract), lib/, tessdata/ and the library itself.
VELLUM_HOME="/opt/vellum"

# The whole stack (vellum serve + both llama.cpp servers) runs as this user.
# Create it first, e.g.:
#   useradd -r -d /opt/vellum -s /sbin/nologin vellum
VELLUM_USER="vellum"
VELLUM_GROUP="vellum"

# Where the web UI + JSON API listen. Loopback only by default — the UI has
# no authentication, so only expose it if you understand that.
VELLUM_LISTEN="127.0.0.1:8090"

# The bundled llama.cpp servers (one process each; chat and embeddings must
# be separate ports).
VELLUM_LLM_PORT="8081"
VELLUM_EMBED_PORT="8082"

# Which GGUFs the launcher starts. qwen3-1.7b.gguf is the small option if the
# 4B model is too heavy for this machine.
VELLUM_LLM_GGUF="qwen3-4b.gguf"
VELLUM_EMBED_GGUF="nomic-embed-text-v1.5.gguf"

# auto picks the Vulkan build when /dev/dri exists and falls back to CPU.
# The chat model follows this; the tiny embedding model is always CPU.
VELLUM_BACKEND="auto"
